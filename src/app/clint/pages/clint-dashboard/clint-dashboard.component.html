<nz-list *ngFor="let item of data" class="demo-loadmore-list">
    <!-- @for (item of list; track item) { -->
    <nz-list-item>
        <!-- @if (item.loading) { -->
        <!-- <nz-skeleton [nzAvatar]="true" [nzActive]="true" [nzTitle]="false" [nzLoading]="true" /> -->
        <!-- } @else { -->
        <ng-container>
            <nz-list-item-meta nzAvatar="https://zos.alipayobjects.com/rmsportal/ODTLcjxAfvqbxHnVXCYX.png"
                nzDescription="{{item.adId}} {{item.date}}">
                <nz-list-item-meta-title>
                    <a href="https://ng.ant.design">{{item.companyId}}</a>
                </nz-list-item-meta-title>
            </nz-list-item-meta>
            <div>
                <h3 *ngIf="item.state=='REJECTED'" style="color: red;">{{item.state}}</h3>

                <h3 *ngIf="item.state=='ACCEPTED'" style="color: green;">{{item.state}}</h3>

                <h3 *ngIf="item.state=='WAITED'" style="color: gray;">{{item.state}}</h3>
            </div>

            <ul nz-list-item-actions>
                <nz-list-item-action><a routerLink="/review/{{item.adId}}">View</a></nz-list-item-action>
                <nz-list-item-action><a *ngIf="item.state!='ACCEPTED'" (click)="deleteReservation(item.reserveId)" style="color: red;">Delete</a></nz-list-item-action>
            </ul>
        </ng-container>

    </nz-list-item>

    <!-- <div class="loadmore" nz-list-load-more> -->
    <!-- @if (!loadingMore) { -->
    <!-- <button nz-button routerLink="/review/{{item.adId}}">View</button> -->
    <!-- } -->
    <!-- </div> -->
</nz-list>
