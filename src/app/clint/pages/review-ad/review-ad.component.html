<div class="list-container">
    <nz-list nzItemLayout="vertical"  class="list">
      <nz-list-item class="list-item">
        <nz-list-item-meta class="list-item-meta">
            <nz-list-item-meta-title class="title">
              <a >{{ item.serviceName}}</a>
            </nz-list-item-meta-title>
            <nz-list-item-meta-description class="description">
              {{ item.serviceDetails }}
            </nz-list-item-meta-description>
            <nz-list-item-meta-description class="description">
              {{ item.companyName}}
            </nz-list-item-meta-description>
        </nz-list-item-meta>
        <div class="price">
          Price: {{ item.price }} $
        </div>
        <div class="container" style="margin-top: 150px;"> 
          <button class="delete-button" *ngIf="!item.reserved" (click)="bookAd()">Book</button>
          <h3 *ngIf="item.reserved" style="color: green;">Reserved Sucssesfuly</h3>
        </div>
        <ul nz-list-item-actions class="actions">
          <li nz-list-item-action class="action">
            <span nz-icon nzType="star-o" class="icon"></span> 156
          </li>
          <li nz-list-item-action class="action">
            <span nz-icon nzType="star-o" class="icon"></span> 156
          </li>
          <li nz-list-item-action class="action">
            <span nz-icon nzType="star-o" class="icon"></span> 2
          </li>
        </ul>
        <nz-list-item-extra class="item-extra">
          <img width="272" alt="logo" [src]="uploudImg(item.image)" class="extra-image" />
        </nz-list-item-extra>
      </nz-list-item>
    </nz-list>
  </div>
