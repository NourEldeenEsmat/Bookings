<div class="bg">
    <div class="parent">
        <div class="nz-col">
            <h1 style="margin-left: 55px;">Client Signup</h1>
        </div>
        <form nz-form [formGroup]="validateForm" (ngSubmit)="signupClient()">
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not valid email">
                    <input nz-input placeholder="E-mail" formControlName="email" id="email">
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not valid name">
                    <input nz-input placeholder="Name" formControlName="name" id="name">
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not valid lastName">
                    <input nz-input placeholder="Last Name" formControlName="lastName" id="lastName">
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not valid phone">
                    <input nz-input placeholder="Phone" formControlName="phone" id="phon">
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not valid password">
                    <input nz-input placeholder="Password" formControlName="password" id="password">
                </nz-form-control>
            </nz-form-item>
            <nz-form-item>
                <nz-form-control nzHasFeedback nzErorrTip="the input is not same password">
                    <input nz-input placeholder="Conform Password" formControlName="checkPassword" id="checkPassword">
                </nz-form-control>
            </nz-form-item>
            <button nz-button class="login-form-button login-form-margin" >Register</button>
            or <a routerLink="/login">login now!</a>
        </form>
    </div>
</div>
